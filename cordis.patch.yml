# Bundle patch layer for dsh-siliconflow-balance.
#
# One row loads this package's main entry (the Host half: credential resolution,
# upstream call, cache, and the /api/siliconflow.balance route). The package.json
# `dsh.client` declaration makes the Web/Desktop page load ./lib/client.js as the
# browser half, which registers the balance pill in conversation.composer.dock.
- insert:
    - id: siliconflow-balance
      name: dsh-siliconflow-balance
